<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Parent Determination</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="app.css?v=322"><style>
:root{--pd-primary:#2563eb;--pd-primary-soft:#eff6ff;--pd-line:#dfe6f1;--pd-text:#10213f;--pd-muted:#6f7f99;--pd-surface:#fff}
button,.file-btn{min-height:44px;border:1px solid var(--pd-line);border-radius:12px;background:var(--pd-surface);color:var(--pd-text);padding:10px 15px;cursor:pointer;font:inherit;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.035);transition:.16s ease}
button:hover,.file-btn:hover{border-color:#b8c8df;background:#f8fbff;transform:translateY(-1px)}
button.primary,.file-btn.primary,#processExcel{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(37,99,235,.16)}
button.primary:hover,.file-btn.primary:hover,#processExcel:hover{filter:brightness(.985)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.mode-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mode-row label{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px 12px;border:1px solid var(--pd-line);border-radius:12px;background:#fff;color:var(--pd-text);font-weight:750;cursor:pointer;transition:.16s ease}.mode-row label:hover{border-color:#b8c8df;background:#f8fbff}.mode-row label input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.mode-row label:has(input:checked){background:var(--pd-primary-soft);border-color:#91b5f7;color:#1d4ed8;box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.filter-chip{border:1px solid var(--pd-line)!important;border-radius:999px!important;background:#fff!important;color:var(--pd-text)!important;box-shadow:none!important}.filter-chip:has(input:checked){background:#eff6ff!important;border-color:#93b4f5!important;color:#1d4ed8!important}.filter-chip input{accent-color:#2563eb}
</style>  <link rel="stylesheet" href="../ui/embedded-theme.css?v=322">
</head><body>
<div class="app">
  <div class="map-wrap"><div id="map" class="map"></div></div>
  <aside class="side">
    <div class="panel compact"><div class="section-label">Polygon service</div><div class="mode-row" id="polygonService"><label><input type="radio" name="polygonService" value="delivery" checked> Delivery</label><label><input type="radio" name="polygonService" value="pickup"> Pickup</label></div></div>
    <div class="panel compact"><div class="mode-row"><label><input type="radio" name="mode" value="single" checked> Single location</label><label><input type="radio" name="mode" value="excel"> Excel file</label></div></div>
    <div class="panel" id="singlePanel"><label>Latitude, Longitude</label><div class="row"><input id="location" class="grow" type="text" placeholder="35.7219, 51.3347"><button id="determine" class="primary" type="button">Determine</button></div></div>
    <div class="panel hidden" id="excelPanel"><label class="file-btn primary" for="locationsFile">Upload locations Excel</label><input id="locationsFile" class="hidden-file" type="file" accept=".xlsx,.xls"><button id="processExcel" type="button">Process & Download</button><div class="help">Column A = latitude, Column B = longitude. Header row is optional.</div></div>
    <div class="panel"><div class="section-label">Expected parents</div><div class="filters" id="typeFilters"></div></div>
    <div id="datasetStatus" class="status">Loading Delivery polygons…</div>
    <div id="resultStatus" class="status"></div>
    <div id="results" class="result"></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="../data/polygon-loader.js?v=322"></script><script src="app.js?v=322"></script>
</body></html>
