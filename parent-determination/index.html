<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Parent Determination</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="../coverage-polygons/coverage.css?v=419"><link rel="stylesheet" href="app.css?v=483">  <link rel="stylesheet" href="../ui/design-system.css?v=351">

<style id="dx-remote-global-font-v367">
html,body,button,input,select,textarea,option,table{font-family:"Gilroy Medium","Gilroy","Yekan Bakh FaNum","Yekan Bakh",Tahoma,"Segoe UI",Arial,sans-serif!important}
</style>


</head><body>
<div class="app">
  <div class="map-wrap"><div id="map" class="map"></div></div>
  <aside class="side">
    <div class="panel compact"><div class="section-label">Polygon service</div><div class="filters" id="polygonService"><label class="filter-chip"><input type="radio" name="polygonService" value="delivery" checked><span>Delivery</span></label><label class="filter-chip"><input type="radio" name="polygonService" value="pickup"><span>Pickup</span></label></div></div>
    <div class="panel compact"><div class="section-label">Input mode</div><div class="filters"><label class="filter-chip"><input type="radio" name="mode" value="single" checked><span>Single location</span></label><label class="filter-chip"><input type="radio" name="mode" value="excel"><span>Excel file</span></label></div></div>
    <div class="panel" id="singlePanel"><label>Latitude, Longitude</label><div class="row"><input id="location" class="grow" type="text" placeholder="35.7219, 51.3347"><button id="determine" class="primary" type="button">Determine</button></div></div>
    <div class="panel hidden" id="excelPanel"><div class="excel-actions"><label class="file-btn" for="locationsFile">Upload Excel</label><button id="processExcel" class="primary" type="button">Process & Download</button></div><input id="locationsFile" class="hidden-file" type="file" accept=".xlsx,.xls"><div id="locationsFileName">No file selected</div><div class="help">Excel may contain any extra columns. Only Latitude and Longitude columns are required; all original columns are preserved in the output.</div></div>
    <div class="panel"><div class="section-label">Expected parents</div><div class="filters" id="typeFilters"></div></div>
    <div id="datasetStatus" class="status">Loading Delivery polygons…</div>
    <div id="resultStatus" class="status"></div>
    <div id="results" class="result"></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="../ui/platform-client.js?v=455"></script><script src="../ui/excel-datasets.js?v=474"></script><script src="../data/polygon-loader.js?v=455"></script><script src="app.js?v=483"></script>
<script src="../ui/theme-bridge.js?v=351"></script></body></html>
