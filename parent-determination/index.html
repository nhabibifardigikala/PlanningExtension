<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Parent Determination</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="app.css?v=319"><style>
button,.file-btn{min-height:40px;border:1px solid #f79009;border-radius:10px;background:#fff;color:#0f2744;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600;box-shadow:none;transition:.15s ease}
button:hover,.file-btn:hover{background:#fff7ed}
button.primary,.file-btn.primary,#processExcel{background:#f79009;color:#fff;border-color:#f79009}
button.primary:hover,.file-btn.primary:hover,#processExcel:hover{filter:brightness(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
</style>  <link rel="stylesheet" href="../ui/embedded-theme.css?v=319">
</head><body>
<div class="app">
  <div class="map-wrap"><div id="map" class="map"></div></div>
  <aside class="side">
    <div class="panel compact"><div class="section-label">Polygon service</div><div class="mode-row" id="polygonService"><label><input type="radio" name="polygonService" value="delivery" checked> Delivery</label><label><input type="radio" name="polygonService" value="pickup"> Pickup</label></div></div>
    <div class="panel compact"><div class="mode-row"><label><input type="radio" name="mode" value="single" checked> Single location</label><label><input type="radio" name="mode" value="excel"> Excel file</label></div></div>
    <div class="panel" id="singlePanel"><label>Latitude, Longitude</label><div class="row"><input id="location" class="grow" type="text" placeholder="35.7219, 51.3347"><button id="determine" class="primary" type="button">Determine</button></div></div>
    <div class="panel hidden" id="excelPanel"><label class="file-btn primary" for="locationsFile">Upload locations Excel</label><input id="locationsFile" class="hidden-file" type="file" accept=".xlsx,.xls"><button id="processExcel" type="button">Process & Download</button><div class="help">Column A = latitude, Column B = longitude. Header row is optional.</div></div>
    <div class="panel"><div class="section-label">Expected parents</div><div class="filters" id="typeFilters"></div></div>
    <div id="datasetStatus" class="status">Loading Delivery polygons…</div>
    <div id="resultStatus" class="status"></div>
    <div id="results" class="result"></div>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="../data/polygon-loader.js?v=319"></script><script src="app.js?v=319"></script>
</body></html>
