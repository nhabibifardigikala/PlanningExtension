<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Planner</title>
<link rel="stylesheet" href="planner.css?v=64">
</head>
<body>
<div class="planner-app">
  <header class="planner-header">
    <div><h1 id="pageTitle">تعریف تسک</h1><div id="pageSubtitle" class="muted">کار جدید را تعریف کنید</div></div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <main class="page-wrap">
    <section class="page active" data-page="create">
      <form id="taskForm" class="panel task-form">
        <input type="hidden" id="taskId">
        <div class="form-row full"><label>عنوان تسک</label><input id="taskTitle" required maxlength="180" placeholder="عنوان فعالیت را وارد کنید"></div>
        <div class="form-grid">
          <div class="form-row"><label>تاریخ انجام</label><div class="date-input-wrap"><input id="taskDate" required placeholder="1405/05/21"><button class="icon-mini" id="pickToday" type="button" title="امروز">●</button></div></div>
          <div class="form-row"><label>اولویت</label><select id="taskPriority"><option value="1">1 - بالا</option><option value="2" selected>2 - متوسط</option><option value="3">3 - پایین</option></select></div>
          <div class="form-row"><label>مسئول</label><input id="taskAssignee" placeholder="نام مسئول"></div>
          <div class="form-row"><label>دسته‌بندی</label><select id="taskCategory"></select></div>
          <div class="form-row"><label>مدت تسک</label><div class="duration"><input id="taskDuration" type="number" min="15" step="15" value="60"><span>دقیقه</span></div></div>
          <div class="form-row"><label>تکرار</label><select id="taskRecurrence"><option value="none">بدون تکرار</option><option value="daily">روزانه</option><option value="weekly">هفتگی</option><option value="custom">سفارشی</option></select></div>
          <div class="form-row hidden" id="customRepeatWrap"><label>تکرار سفارشی</label><div class="duration"><span>هر</span><input id="taskRepeatEvery" type="number" min="1" value="2"><span>روز</span></div></div>
          <div class="form-row"><label>وضعیت</label><select id="taskStatus"><option value="todo">انجام نشده</option><option value="done">انجام شده</option><option value="cancelled">لغو شده</option></select></div>
        </div>
        <div class="form-row full"><label>توضیحات</label><textarea id="taskDescription" rows="4" placeholder="توضیحات تسک"></textarea></div>
        <div class="form-actions"><button type="button" id="resetTask" class="btn ghost">پاک کردن فرم</button><button type="submit" class="btn primary" id="saveTask">ذخیره تسک</button></div>
      </form>
    </section>

    <section class="page" data-page="tasks">
      <div class="panel filters">
        <div class="filter-grid">
          <label>تاریخ<input id="filterDate" placeholder="همه تاریخ‌ها"></label>
          <label>مسئول<select id="filterAssignee"><option value="">همه</option></select></label>
          <label>اولویت<select id="filterPriority"><option value="">همه</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <label>وضعیت<select id="filterStatus"><option value="">همه</option><option value="todo">انجام نشده</option><option value="done">انجام شده</option><option value="cancelled">لغو شده</option></select></label>
        </div>
        <div class="filter-actions"><button id="clearFilters" class="btn ghost">پاک کردن فیلترها</button><span id="taskCount" class="muted"></span></div>
      </div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="page" data-page="daily">
      <div class="daily-head panel"><button id="prevDay" class="nav-day">‹</button><div><strong id="dailyDate"></strong><small id="dailyWeekday"></small></div><button id="nextDay" class="nav-day">›</button></div>
      <div id="unscheduled" class="unscheduled panel"></div>
      <div class="timeline panel"><div id="timeline"></div></div>
    </section>

    <section class="page" data-page="settings">
      <div class="settings-grid">
        <div class="panel setting-card"><h2>دسته‌بندی‌ها</h2><div class="inline"><input id="newCategory" placeholder="نام دسته‌بندی"><button id="addCategory" class="btn primary">اضافه</button></div><div id="categoryList" class="chips"></div></div>
        <div class="panel setting-card"><h2>تقویم</h2><label class="setting-row"><span>نوع تقویم</span><select id="calendarSetting"><option value="jalali">شمسی</option><option value="gregorian">میلادی</option></select></label><div id="holidayInfo" class="holiday-info"></div></div>
        <div class="panel setting-card"><h2>ساعت کاری</h2><div class="two-col"><label>شروع<input id="workStart" type="time"></label><label>پایان<input id="workEnd" type="time"></label></div></div>
        <div class="panel setting-card"><h2>اعلان‌ها</h2><label class="toggle-row"><input id="notificationsEnabled" type="checkbox"><span>فعال بودن اعلان‌ها</span></label><button id="notificationPermission" class="btn ghost">فعال‌سازی اعلان مرورگر</button><small class="muted">شروع هر تسک و پایان زمان آن ۱۵ دقیقه قبل یادآوری می‌شود.</small></div>
        <div class="panel setting-card"><h2>ورود و خروج اطلاعات</h2><div class="import-export"><button id="exportExcel" class="btn primary">Export Excel</button><label class="btn ghost file-label">Import Excel<input id="importExcel" type="file" accept=".xlsx,.xls,.csv" hidden></label></div></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Planner navigation">
    <button class="nav-item active" data-target="create" title="تعریف تسک"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg><span>تعریف</span></button>
    <button class="nav-item" data-target="tasks" title="لیست تسک‌ها"><svg viewBox="0 0 24 24"><path d="M5 5h14v2H5zm0 6h14v2H5zm0 6h14v2H5z"/></svg><span>لیست</span></button>
    <button class="nav-item" data-target="daily" title="برنامه روزانه"><svg viewBox="0 0 24 24"><path d="M6 2h2v2h8V2h2v2h3v18H3V4h3zm13 8H5v10h14z"/></svg><span>روزانه</span></button>
    <button class="nav-item" data-target="settings" title="تنظیمات"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.5 1a8 8 0 0 0-1.7-1L15 3h-4l-.3 3.1a8 8 0 0 0-1.7 1l-2.5-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.5-1a8 8 0 0 0 1.7 1L11 21h4l.3-3.1a8 8 0 0 0 1.7-1l2.5 1 2-3.4zM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span>تنظیمات</span></button>
  </nav>
</div>

<div id="notificationBox" class="notification-box hidden"><div><strong id="notificationTitle"></strong><p id="notificationText"></p></div><div class="notice-actions"><button id="snoozeNotice">Snooze</button><button id="dismissNotice">Dismiss</button></div></div>
<div id="toast" class="toast hidden"></div>
<script src="planner.js?v=64"></script>
</body></html>
