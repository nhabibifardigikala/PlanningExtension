<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coverage Polygons</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="coverage.css"></head><body><div class="app"><div class="map-wrap"><div id="map" class="map"></div><div class="legend"><div><i class="sw" style="background:#1976d2"></i>Normal</div><div><i class="sw" style="background:#16a34a"></i>Medium</div><div><i class="sw" style="background:#7c3aed"></i>Large</div><div><i class="sw" style="background:#F79009"></i>Other</div></div></div><aside class="side"><h1 class="title">Coverage Polygons</h1><p class="sub">Built-in polygon dataset</p><div class="panel"><div class="row"><input id="latlon" class="grow" type="text" placeholder="Latitude, Longitude"><button id="check" class="primary" type="button">Check</button></div><div id="pointStatus" class="status"></div></div><div class="panel"><div class="section-label">Type</div><div id="typeFilters" class="filters"></div><div class="section-label">District</div><div id="districtFilters" class="filters"></div><div class="section-label">Submit Type</div><div id="submitFilters" class="filters"></div><div class="section-label">Active</div><div id="activeFilters" class="filters"></div></div><div class="panel"><div class="row"><input id="search" class="grow" type="text" placeholder="Search polygons..."><button id="reset" type="button">Reset</button></div><div class="row" style="justify-content:space-between;margin:9px 0 5px"><span class="count" id="count"></span></div><div id="results" class="result"></div></div></aside></div><script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script><script src="coverage.js?v=88"></script></body></html>
