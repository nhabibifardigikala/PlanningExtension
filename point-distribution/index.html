<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Point Distribution</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="point-distribution.css"></head><body><div class="app"><div class="map-wrap"><div id="map" class="map"></div><div class="legend"><div><i class="sw" style="background:#1976d2"></i>Polygon</div><div><i class="sw" style="background:#e11d48;height:10px;width:10px;border-radius:50%"></i>Point</div></div></div><aside class="side"><h1 class="title">Point Distribution</h1><p class="sub">Upload locations and view them beside built-in coverage polygons.</p><div class="panel"><div class="row"><label class="file-btn primary grow" for="pointsFile">Upload Points Excel</label><input id="pointsFile" class="hidden-file" type="file" accept=".xlsx,.xls"><button id="reset" type="button">Reset</button></div><div id="fileStatus" class="status">Expected columns: Lat, Long. Optional: ParcelCode, CityName, address.</div></div><div class="panel"><div class="section-label">Type</div><div id="typeFilters" class="filters"></div><div class="section-label">District</div><div id="districtFilters" class="filters"></div></div><div class="panel"><input id="search" type="text" placeholder="Search points or matched polygons..."><div class="row" style="justify-content:space-between;margin:9px 0 5px"><span class="count" id="count"></span></div><div id="results" class="result"></div></div></aside></div><script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="../data/polygon-loader.js?v=218"></script><script src="point-distribution.js?v=218"></script></body></html>
