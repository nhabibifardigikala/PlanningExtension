<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note</title><link rel="stylesheet" href="note.css?v=70"></head><body><div class="app"><header><div><h1>Note</h1><small>یادداشت‌ها و چک‌لیست‌ها</small></div><div class="tabs"><button class="tab active" data-page="notes">یادداشت‌ها</button><button class="tab" data-page="settings">تنظیمات</button></div></header><main><section id="notesPage" class="page active"><div class="toolbar"><button id="newNote" class="primary">+ یادداشت جدید</button><select id="filterCategory"><option value="">همه دسته‌بندی‌ها</option></select></div><div id="notesGrid" class="notes-grid"></div></section><section id="settingsPage" class="page"><div class="panel"><h2>دسته‌بندی‌ها</h2><div class="row"><input id="newCategory" placeholder="نام دسته‌بندی"><button id="addCategory" class="primary">اضافه</button></div><div id="categoryChips" class="chips"></div></div><div class="panel"><h2>Import / Export</h2><div class="row wrap"><button id="exportNotes" class="primary">Export Notes</button><label class="button">Import Notes<input id="importNotes" type="file" accept=".json" hidden></label></div></div></section></main></div><div id="editor" class="overlay hidden"><div class="editor"><div class="editor-head"><h2 id="editorTitle">یادداشت</h2><button id="closeEditor">×</button></div><input id="noteTitle" placeholder="عنوان یادداشت"><div class="two"><label>رنگ<select id="noteColor"><option value="#fff4cc">زرد</option><option value="#ffe1d6">نارنجی</option><option value="#dff4ff">آبی</option><option value="#e6f6df">سبز</option><option value="#f1e4ff">بنفش</option><option value="#f2f2f2">خاکستری</option></select></label><label>دسته‌بندی<select id="noteCategory"></select></label></div><textarea id="noteText" rows="7" placeholder="متن یادداشت"></textarea><div class="check-area"><div class="row"><input id="checkText" placeholder="آیتم چک‌لیست"><button id="addCheck">افزودن</button></div><div id="checkList"></div></div><div class="image-area"><label class="button">افزودن تصویر<input id="noteImage" type="file" accept="image/*" hidden></label><div id="imagePreview"></div></div><div class="editor-actions"><button id="deleteNote" class="danger">حذف</button><button id="saveNote" class="primary">ذخیره</button></div></div></div><script src="note.js?v=70"></script></body></html>
