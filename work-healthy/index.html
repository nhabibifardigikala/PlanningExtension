<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Healthy</title><link rel="stylesheet" href="app.css?v=226"></head><body>
<main id="mainApp">
<header><div><h1>Work Healthy</h1><p>Short guided movement breaks for desk work.</p></div><label class="switch" title="Enable reminders"><input id="enabled" type="checkbox"><span></span></label></header>
<section class="card"><h2>Reminder settings</h2><div class="grid"><label>Every (minutes)<input id="interval" type="number" min="1" step="1"></label><label>Exercise time (seconds)<input id="duration" type="number" min="15" step="15"></label><label>Start time<input id="start" type="time"></label><label>End time<input id="end" type="time"></label></div><h3>Exercise groups</h3><div id="groups" class="groups"></div><div class="actions"><button id="save" class="primary">Save settings</button><button id="showNow">Show exercise now</button></div><div id="next" class="muted"></div></section>
<section class="card"><div class="section-row"><div><h2>Movement library</h2><p>Slow, controlled movements. Stop immediately if you feel pain or dizziness.</p></div></div><div id="library" class="library"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="exercise"><button id="close" aria-label="Close">×</button><div id="picture"></div><div class="exercise-copy"><div class="exercise-kicker">MOVE BREAK</div><h2 id="title"></h2><p id="text"></p><div class="count" id="count"></div><div class="modal-actions"><button id="snooze">Snooze 10 min</button><button id="done" class="primary">Done</button></div></div></div></div>
<script src="app.js?v=226"></script></body></html>
