<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Healthy</title><link rel="stylesheet" href="app.css?v=224"></head><body><main><header><div><h1>Work Healthy</h1><p>Professional ergonomic movement reminders for desk work.</p></div><label class="switch"><input id="enabled" type="checkbox"><span></span></label></header><section class="card"><h2>Reminder settings</h2><div class="grid"><label>Every (minutes)<input id="interval" type="number" min="15" step="5"></label><label>Exercise time (seconds)<input id="duration" type="number" min="15" step="15"></label><label>Start time<input id="start" type="time"></label><label>End time<input id="end" type="time"></label></div><h3>Exercise groups</h3><div id="groups" class="groups"></div><button id="save" class="primary">Save settings</button> <button id="showNow">Show exercise now</button><div id="next" class="muted"></div></section><section class="card"><h2>Movement library</h2><div id="library" class="library"></div></section><div id="modal" class="modal hidden"><div class="exercise"><button id="close" aria-label="Close">×</button><div id="picture"></div><div class="exercise-copy"><h2 id="title"></h2><p id="text"></p><div class="count" id="count"></div><div class="modal-actions"><button id="snooze">Snooze 10 min</button><button id="done" class="primary">Done</button></div></div></div></div></main><script src="app.js?v=224"></script></body></html>
