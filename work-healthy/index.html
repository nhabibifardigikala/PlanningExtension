<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Healthy</title><link rel="stylesheet" href="app.css?v=228"></head><body>
<main id="mainApp">
<header><div><h1>Work Healthy</h1><p>Clear visual reminders for healthier desk work.</p></div><label class="switch" title="Enable all reminders"><input id="enabled" type="checkbox"><span></span></label></header>
<section class="card schedule"><div><h2>Working hours</h2><p>Each activity has its own reminder interval and duration. Minimum interval is 1 minute.</p></div><div class="hours"><label>Start<input id="start" type="time"></label><label>End<input id="end" type="time"></label><button id="save" class="primary">Save</button><span id="saved"></span></div></section>
<section id="library" class="library"></section>
</main>
<div id="modal" class="modal hidden"><div class="exercise"><button id="close" aria-label="Close">×</button><div id="picture" class="hero-picture"></div><div class="exercise-copy"><div class="exercise-kicker">WORK HEALTHY</div><h2 id="title"></h2><p id="text"></p><div class="count" id="count"></div><div class="modal-actions"><button id="snooze">Snooze 10 min</button><button id="done" class="primary">Done</button></div></div></div></div>
<script src="app.js?v=228"></script></body></html>
