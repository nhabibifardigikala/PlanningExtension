<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Authenticator</title>
<link rel="stylesheet" href="design-system.css?v=344">
<style>
html,body{margin:0;min-height:100%;background:var(--dx-bg,#f5f7fb);color:var(--dx-text,#10213f);font-family:"Gilroy Medium","Yekan Bakh FaNum",Segoe UI,Arial,sans-serif}.box{min-height:240px;display:grid;place-items:center;padding:28px}.card{width:min(460px,100%);padding:24px;border:1px solid var(--dx-line,#e2e8f2);border-radius:18px;background:var(--dx-surface,#fff);box-shadow:var(--dx-shadow,0 16px 40px #0001)}h2{margin:0 0 8px}p{color:var(--dx-muted,#667085);line-height:1.6}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--dx-primary,#2563eb);color:#fff;font-weight:800;cursor:pointer}.ok{color:#15803d}.err{color:#b42318}
</style>
</head>
<body>
<main class="box"><section class="card"><h2>Authenticator</h2><p id="status">Opening the secure Authenticator…</p><button id="open" class="btn" hidden>Open Authenticator</button></section></main>
<script src="platform-client.js?v=344"></script>
<script>
(async()=>{
  const status=document.getElementById('status'),button=document.getElementById('open');
  async function launch(){
    button.hidden=true; status.className=''; status.textContent='Opening the secure Authenticator…';
    try{
      const r=await DigiExpressPlatform.call('localPage.open',{path:'authenticator.html',active:true});
      if(r?.ok===false)throw new Error(r.error||'Authenticator could not be opened.');
      status.className='ok'; status.textContent='Authenticator opened.';
    }catch(e){status.className='err';status.textContent=e?.message||String(e);button.hidden=false;}
  }
  button.addEventListener('click',launch);
  await launch();
})();
</script>
</body>
</html>
