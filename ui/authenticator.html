<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="design-system.css?v=338"><style>html,body{margin:0;min-height:100%;background:var(--dx-bg,#f5f7fb);color:var(--dx-text,#10213f);font-family:"Gilroy Medium","Yekan Bakh FaNum",Segoe UI,Arial,sans-serif}.box{min-height:320px;display:grid;place-items:center;padding:28px}.card{width:min(520px,100%);padding:24px;border:1px solid var(--dx-line,#e2e8f2);border-radius:18px;background:var(--dx-surface,#fff);box-shadow:var(--dx-shadow,0 16px 40px #0001)}h2{margin:0 0 8px}p{color:var(--dx-muted,#667085);line-height:1.6}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--dx-primary,#2563eb);color:#fff;font-weight:800;cursor:pointer}</style></head><body><main class="box"><section class="card"><h2>Authenticator</h2><p>Authenticator remains inside the secure Host boundary. Open the secure local page when you need it.</p><button id="open" class="btn">Open Authenticator</button><p id="status"></p></section></main><script src="platform-client.js?v=338"></script><script>open.onclick=async()=>{try{await DigiExpressPlatform.call('localPage.open',{path:'authenticator.html',active:true});status.textContent='Authenticator opened in a secure tab.'}catch(e){status.textContent=e.message}}</script></body></html>
