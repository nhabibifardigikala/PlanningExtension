<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro</title><link rel="stylesheet" href="app.css?v=233"></head><body><main><div class="settings-row"><button id="settingsBtn">Settings</button></div><section class="card timer"><div id="phase" class="phase">Focus</div><div id="clock">25:00</div><div class="progress"><i id="bar"></i></div><div class="actions"><button id="toggle" class="primary">Start</button><button id="skip">Skip</button><button id="reset">Reset</button></div><div class="stats"><span>Completed today <b id="done">0</b></span><span>Cycle <b id="cycle">1</b></span></div></section><section id="settings" class="card hidden"><h2>Settings</h2><div class="grid"><label>Focus (min)<input id="focus" type="number" min="1" max="180"></label><label>Short break (min)<input id="short" type="number" min="1" max="60"></label><label>Long break (min)<input id="long" type="number" min="1" max="120"></label><label>Long break every<input id="rounds" type="number" min="1" max="12"></label></div><label class="check"><input id="auto" type="checkbox"> Auto-start next session</label><label class="check"><input id="sound" type="checkbox"> Sound alert</label><button id="save" class="primary">Save settings</button></section><div id="notice" class="notice hidden"><strong id="noticeTitle"></strong><span id="noticeText"></span><button id="noticeClose">Dismiss</button></div></main><script src="app.js?v=233"></script></body></html>
