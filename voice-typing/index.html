<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Typing</title>
<link rel="stylesheet" href="voice.css?v=227">
</head>
<body>
<main class="app">
  <section class="language-bar" aria-label="Recognition language">
    <button class="lang active" data-lang="fa-IR" type="button">فارسی</button>
    <button class="lang" data-lang="en-US" type="button">English</button>
    <button class="lang" data-lang="ar-SA" type="button">العربية</button>
  </section>

  <section class="recorder-panel">
    <button id="micBtn" class="mic" type="button" aria-label="Start voice typing" title="Start voice typing">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5a7 7 0 0 1 7 7v11a7 7 0 0 1-14 0V12a7 7 0 0 1 7-7Zm-3 7v11a3 3 0 0 0 6 0V12a3 3 0 0 0-6 0Zm-9 9h4v2a8 8 0 0 0 16 0v-2h4v2a12 12 0 0 1-10 11.8V40h7v4H15v-4h7v-5.2A12 12 0 0 1 12 23v-2Z"/></svg>
    </button>
    <div class="recorder-copy">
      <strong id="status">Ready to listen</strong>
      <span id="hint">Press the microphone and start speaking.</span>
    </div>
    <div id="level" class="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="editor-card">
    <div class="editor-head"><strong>Transcript</strong><span id="interim"></span></div>
    <textarea id="output" placeholder="Your speech will appear here…" spellcheck="true"></textarea>
  </section>

  <section class="controls">
    <button id="copyBtn" class="secondary" type="button">Copy text</button>
    <button id="clearBtn" class="secondary" type="button">Clear</button>
    <button id="downloadBtn" class="secondary" type="button">Download TXT</button>
  </section>
</main>
<div id="toast" class="toast" role="status">Copied</div>
<script src="voice.js?v=227"></script>
</body>
</html>
